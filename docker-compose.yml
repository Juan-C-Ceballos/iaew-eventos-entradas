name: iaew-eventos-entradas

# Los nombres de servicio coinciden con la vista C4 Container (docs/c4-container.md).
# Las variables se leen del .env del proyecto (si existe) con valores por defecto
# locales; dentro de la red de Compose los hosts son los nombres de servicio.

# api, worker y db-init comparten la misma imagen (cambia solo el comando).
x-app-image: &app-image
  build: .
  image: iaew-eventos-entradas:local

services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.2-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-iaew}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS:-iaew-local}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-init:
    <<: *app-image
    command: ["sh", "-c", "npm run migrate && npm run seed"]
    environment:
      MONGODB_URI: mongodb://mongodb:27017/iaew_eventos
      SERVICE_NAME: db-init
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app-image
    command: ["node", "src/app.js"]
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/iaew_eventos
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-tu-tenant.us.auth0.com}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://iaew-eventos-api}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-colocar-api-key-local}
      RABBIT_URL: amqp://${RABBIT_USER:-iaew}:${RABBIT_PASS:-iaew-local}@rabbitmq:5672
      OUTBOX_INTERVALO_MS: ${OUTBOX_INTERVALO_MS:-1000}
      PAGOS_URL: http://pagos-mock:4000
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-colocar-secreto-compartido-local}
      WEBHOOK_TOLERANCIA_SEGUNDOS: ${WEBHOOK_TOLERANCIA_SEGUNDOS:-300}
      RESERVA_TTL_MINUTOS: ${RESERVA_TTL_MINUTOS:-15}
      PAGO_TIMEOUT_MINUTOS: ${PAGO_TIMEOUT_MINUTOS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    <<: *app-image
    command: ["node", "src/worker.js"]
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongodb:27017/iaew_eventos
      RABBIT_URL: amqp://${RABBIT_USER:-iaew}:${RABBIT_PASS:-iaew-local}@rabbitmq:5672
      RETRY_DELAY_MS: ${RETRY_DELAY_MS:-3000}
      MAX_RETRIES: ${MAX_RETRIES:-3}
      PAGOS_URL: http://pagos-mock:4000
      BARRIDO_INTERVALO_MS: ${BARRIDO_INTERVALO_MS:-60000}
      EVENTO_FINALIZA_TRAS_HORAS: ${EVENTO_FINALIZA_TRAS_HORAS:-12}
      METRICS_PORT: 9464
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  pagos-mock:
    build: ./services/pagos-mock
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      WEBHOOK_URL: http://api:3000/webhooks/pagos
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-colocar-secreto-compartido-local}
      PAGO_DEMORA_MS: ${PAGO_DEMORA_MS:-200}
      WEBHOOK_HABILITADO: ${WEBHOOK_HABILITADO:-true}

  # Observabilidad (ADR 0008): Prometheus recolecta /metrics de api y worker, y Grafana muestra el
  # dashboard provisionado desde observabilidad/ (p95, throughput y error rate).
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observabilidad/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin-local}
      # Solo local: el dashboard se ve sin iniciar sesión (el acceso anónimo es de solo lectura).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/eventos-entradas.json
    volumes:
      - ./observabilidad/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidad/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  mongo-data:
  prometheus-data:
  grafana-data:
